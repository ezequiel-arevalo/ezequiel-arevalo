<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  /* Consolas es mas angosta que las mono de Linux y Mac (0.55 contra 0.60).
     El 109% la iguala, asi que la grilla de 60 columnas mide lo mismo en
     los tres sistemas. */
  size-adjust: 109%;
}
.key {fill: #ffa657;}
.value {fill: #a5d6ff;}
.cc {fill: #616e7f;}
text, tspan {white-space: pre;}
