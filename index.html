<style>
:root{
  --paper:#f1f2f6;
  --ink:#151821;
  --muted:#565c6b;
  --line:#d2d6e2;
  --link:#1b33e0;
  --visited:#6a3da8;
  --work:#92400e;
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e1016;
    --ink:#e7e9f0;
    --muted:#9aa2b4;
    --line:#252939;
    --link:#8ba2ff;
    --visited:#c4a6f2;
    --work:#e0a35c;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:grid;
  grid-template-rows:1fr auto;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f);
  font-size:clamp(1rem,.96rem + .2vw,1.075rem);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
main{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(2.5rem,8vw,6rem) clamp(1.25rem,6vw,5rem) clamp(2rem,5vw,4rem);
  max-width:56rem;
  width:100%;
  margin-inline:auto;
}
a{color:var(--link);text-underline-offset:.18em;text-decoration-thickness:.07em}
a:visited{color:var(--visited)}
:focus-visible{outline:2.5px solid var(--link);outline-offset:3px;border-radius:2px}
::selection{background:var(--link);color:#fff}
p{margin:0 0 1em;max-width:46ch}

.status{
  display:inline-flex;align-items:center;gap:.55rem;
  color:var(--work);font-size:.88rem;font-weight:500;
  margin:0 0 2rem;
}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;flex:none}

h1{
  font-size:clamp(2.4rem,1.2rem + 5.4vw,5rem);
  line-height:1.03;
  letter-spacing:-.04em;
  font-weight:700;
  margin:0 0 1.1rem;
  max-width:12ch;
}
h1 .name{
  display:inline;
  background-image:linear-gradient(var(--link),var(--link));
  background-repeat:no-repeat;
  background-position:0 92%;
  background-size:100% .085em;
}
.js h1 .name{animation:draw .9s .2s cubic-bezier(.2,.7,.3,1) both}
@keyframes draw{from{background-size:0 .085em}to{background-size:100% .085em}}
@media (prefers-reduced-motion: reduce){.js h1 .name{animation:none}}

.role{
  font-size:clamp(1.05rem,1rem + .55vw,1.4rem);
  color:var(--muted);
  max-width:34ch;
  margin:0 0 2.4rem;
}

.note{color:var(--muted);max-width:44ch;margin:0}

footer{
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:.83rem;
  padding:1.2rem clamp(1.25rem,6vw,5rem);
  max-width:56rem;
  width:100%;
  margin-inline:auto;
}
footer p{margin:0;max-width:none}
</style>
</head>

<body>
<main>
  <p class="status"><span class="dot" aria-hidden="true"></span>Sitio en mantenimiento</p>

  <h1>Soy <span class="name">Ezequiel Arévalo</span></h1>
  <p class="role">Frontend web developer en Argentina. React, TypeScript y Next.js.</p>

  <p class="note">Estoy rehaciendo el portfolio. Vuelve en unos días con los proyectos nuevos.</p>
</main>

<footer>
  <p>© <span id="anio">2026</span> Ezequiel Arévalo · Frontend web developer, Argentina</p>
</footer>

<script>
document.documentElement.classList.add('js');
document.getElementById('anio').textContent = new Date().getFullYear();
</script>
</body>
